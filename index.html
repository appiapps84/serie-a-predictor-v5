<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulatore Partite - Serie A & Coppa Italia</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-muted);
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .results {
      display: none;
    }

    .prob-bar-container {
      margin-bottom: 12px;
    }

    .prob-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .prob-bar-bg {
      background-color: var(--border);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .prob-bar-fill {
      height: 100%;
      background-color: var(--accent);
      width: 0%;
      transition: width 0.5s ease-out;
    }

    .scores-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .score-item {
      background: #0f172a;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .score-item .match {
      font-weight: bold;
      color: var(--accent);
    }

    .score-item .perc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Simulatore Partite</h1>

  <!-- SELEZIONE MODALITÀ -->
  <div class="card">
    <div class="form-group">
      <label for="competition">Competizione</label>
      <select id="competition" onchange="toggleMode()">
        <option value="seriea">Serie A (Personalizzata)</option>
        <option value="coppa">Sedicesimi Coppa Italia</option>
      </select>
    </div>

    <!-- SELEZIONE COPPA ITALIA -->
    <div id="coppa-container" class="form-group" style="display: none;">
      <label for="coppa-fixture">Sfida Sedicesimi Coppa Italia</label>
      <select id="coppa-fixture" onchange="loadCoppaFixture()">
        <option value="Genoa-Sudtirol">Genoa vs Südtirol</option>
        <option value="Fiorentina-Pisa">Fiorentina vs Pisa</option>
        <option value="Parma-Cremonese">Parma vs Cremonese</option>
        <option value="Torino-Monza">Torino vs Monza</option>
        <option value="Sassuolo-Frosinone">Sassuolo vs Frosinone</option>
        <option value="Udinese-Venezia">Udinese vs Venezia</option>
        <option value="Palermo-Mantova">Palermo vs Mantova</option>
        <option value="Cagliari-Verona">Cagliari vs Hellas Verona</option>
      </select>
    </div>

    <!-- SELEZIONE SQUADRE LIBERA -->
    <div id="manual-container" class="grid-2">
      <div class="form-group">
        <label for="home-team">Squadra Casa</label>
        <select id="home-team" onchange="updateStats('home')"></select>
      </div>
      <div class="form-group">
        <label for="away-team">Squadra Trasferta</label>
        <select id="away-team" onchange="updateStats('away')"></select>
      </div>
    </div>

    <button onclick="simulateMatch()">Simula Partita (10.000 iterazioni)</button>
  </div>

  <!-- STATISTICHE SQUADRE -->
  <div class="card">
    <h3>Parametri Squadre</h3>
    <div class="grid-2">
      <div>
        <h4 id="label-home">Casa</h4>
        <div class="form-group">
          <label>Forza Attacco</label>
          <input type="number" id="home-att" step="0.05" value="1.0">
        </div>
        <div class="form-group">
          <label>Forza Difesa (minore = migliore)</label>
          <input type="number" id="home-def" step="0.05" value="1.0">
        </div>
      </div>
      <div>
        <h4 id="label-away">Trasferta</h4>
        <div class="form-group">
          <label>Forza Attacco</label>
          <input type="number" id="away-att" step="0.05" value="1.0">
        </div>
        <div class="form-group">
          <label>Forza Difesa (minore = migliore)</label>
          <input type="number" id="away-def" step="0.05" value="1.0">
        </div>
      </div>
    </div>
  </div>

  <!-- RISULTATI SIMULAZIONE -->
  <div id="results" class="card results">
    <h2>Risultati Simulazione</h2>

    <div class="prob-bar-container">
      <div class="prob-header">
        <span>Vittoria Casa (1)</span>
        <span id="prob-1">0%</span>
      </div>
      <div class="prob-bar-bg"><div id="bar-1" class="prob-bar-fill"></div></div>
    </div>

    <div class="prob-bar-container">
      <div class="prob-header">
        <span>Pareggio (X)</span>
        <span id="prob-x">0%</span>
      </div>
      <div class="prob-bar-bg"><div id="bar-x" class="prob-bar-fill"></div></div>
    </div>

    <div class="prob-bar-container">
      <div class="prob-header">
        <span>Vittoria Trasferta (2)</span>
        <span id="prob-2">0%</span>
      </div>
      <div class="prob-bar-bg"><div id="bar-2" class="prob-bar-fill"></div></div>
    </div>

    <div style="margin-top: 20px;">
      <p><strong>xG Attesi:</strong> <span id="xg-result">0 - 0</span></p>
    </div>

    <h3>Risultati Esatti più Probabili</h3>
    <div id="scores-container" class="scores-list"></div>
  </div>
</div>

<script>
  // Dataset Squadre (Serie A + Altre squadre di Coppa Italia)
  const teamsData = {
    // Serie A
    'Atalanta': { att: 1.25, def: 0.85 },
    'Bologna': { att: 1.05, def: 0.90 },
    'Cagliari': { att: 0.85, def: 1.10 },
    'Como': { att: 0.90, def: 1.05 },
    'Fiorentina': { att: 1.10, def: 0.95 },
    'Genoa': { att: 0.90, def: 1.00 },
    'Inter': { att: 1.40, def: 0.70 },
    'Juventus': { att: 1.20, def: 0.75 },
    'Lazio': { att: 1.10, def: 0.95 },
    'Lecce': { att: 0.75, def: 1.15 },
    'Milan': { att: 1.30, def: 0.85 },
    'Monza': { att: 0.85, def: 1.05 },
    'Napoli': { att: 1.25, def: 0.80 },
    'Parma': { att: 0.85, def: 1.10 },
    'Roma': { att: 1.15, def: 0.90 },
    'Sassuolo': { att: 0.95, def: 1.05 },
    'Torino': { att: 0.95, def: 0.90 },
    'Udinese': { att: 0.90, def: 1.00 },
    'Venezia': { att: 0.80, def: 1.15 },
    'Verona': { att: 0.80, def: 1.10 },

    // Squadre Coppa Italia (Serie B / Altre)
    'Sudtirol': { att: 0.70, def: 1.10 },
    'Pisa': { att: 0.75, def: 1.05 },
    'Cremonese': { att: 0.80, def: 1.05 },
    'Frosinone': { att: 0.75, def: 1.15 },
    'Mantova': { att: 0.65, def: 1.20 },
    'Palermo': { att: 0.85, def: 1.05 }
  };

  const AVG_HOME_GOALS = 1.45;
  const AVG_AWAY_GOALS = 1.15;

  function init() {
    const homeSelect = document.getElementById('home-team');
    const awaySelect = document.getElementById('away-team');
    
    // Popola i menu con la lista alfabetica
    const teams = Object.keys(teamsData).sort();
    teams.forEach(team => {
      homeSelect.add(new Option(team, team));
      awaySelect.add(new Option(team, team));
    });

    // Selezioni di default
    homeSelect.value = 'Inter';
    awaySelect.value = 'Juventus';
    
    updateStats('home');
    updateStats('away');
  }

  function toggleMode() {
    const comp = document.getElementById('competition').value;
    const coppaContainer = document.getElementById('coppa-container');
    const manualContainer = document.getElementById('manual-container');

    if (comp === 'coppa') {
      coppaContainer.style.display = 'block';
      manualContainer.style.display = 'none';
      loadCoppaFixture();
    } else {
      coppaContainer.style.display = 'none';
      manualContainer.style.display = 'grid';
      updateStats('home');
      updateStats('away');
    }
  }

  function loadCoppaFixture() {
    const fixture = document.getElementById('coppa-fixture').value;
    const [home, away] = fixture.split('-');

    document.getElementById('home-team').value = home;
    document.getElementById('away-team').value = away;

    updateStats('home');
    updateStats('away');
  }

  function updateStats(side) {
    const teamName = document.getElementById(`${side}-team`).value;
    document.getElementById(`label-${side}`).innerText = teamName;
    if (teamsData[teamName]) {
      document.getElementById(`${side}-att`).value = teamsData[teamName].att;
      document.getElementById(`${side}-def`).value = teamsData[teamName].def;
    }
  }

  // Generatore numeri casuali secondo distribuzione di Poisson
  function poissonRandom(lambda) {
    let L = Math.exp(-lambda);
    let k = 0;
    let p = 1;
    do {
      k++;
      p *= Math.random();
    } while (p > L);
    return k - 1;
  }

  function simulateMatch() {
    const homeAtt = parseFloat(document.getElementById('home-att').value);
    const homeDef = parseFloat(document.getElementById('home-def').value);
    const awayAtt = parseFloat(document.getElementById('away-att').value);
    const awayDef = parseFloat(document.getElementById('away-def').value);

    // Calcolo expected goals (xG)
    const lambdaHome = homeAtt * awayDef * AVG_HOME_GOALS;
    const lambdaAway = awayAtt * homeDef * AVG_AWAY_GOALS;

    const iterations = 10000;
    let homeWins = 0;
    let draws = 0;
    let awayWins = 0;
    const scoreCounts = {};

    for (let i = 0; i < iterations; i++) {
      const gHome = poissonRandom(lambdaHome);
      const gAway = poissonRandom(lambdaAway);

      if (gHome > gAway) homeWins++;
      else if (gHome === gAway) draws++;
      else awayWins++;

      const key = `${gHome}-${gAway}`;
      scoreCounts[key] = (scoreCounts[key] || 0) + 1;
    }

    // Aggiornamento UI
    const p1 = ((homeWins / iterations) * 100).toFixed(1);
    const px = ((draws / iterations) * 100).toFixed(1);
    const p2 = ((awayWins / iterations) * 100).toFixed(1);

    document.getElementById('prob-1').innerText = p1 + '%';
    document.getElementById('prob-x').innerText = px + '%';
    document.getElementById('prob-2').innerText = p2 + '%';

    document.getElementById('bar-1').style.width = p1 + '%';
    document.getElementById('bar-x').style.width = px + '%';
    document.getElementById('bar-2').style.width = p2 + '%';

    document.getElementById('xg-result').innerText = `${lambdaHome.toFixed(2)} - ${lambdaAway.toFixed(2)}`;

    // Top risultati esatti
    const sortedScores = Object.entries(scoreCounts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 6);

    const scoresContainer = document.getElementById('scores-container');
    scoresContainer.innerHTML = '';

    sortedScores.forEach(([score, count]) => {
      const perc = ((count / iterations) * 100).toFixed(1);
      const div = document.createElement('div');
      div.className = 'score-item';
      div.innerHTML = `<div class="match">${score}</div><div class="perc">${perc}%</div>`;
      scoresContainer.appendChild(div);
    });

    document.getElementById('results').style.display = 'block';
  }

  // Inizializza al caricamento della pagina
  window.onload = init;
</script>

</body>
</html>
